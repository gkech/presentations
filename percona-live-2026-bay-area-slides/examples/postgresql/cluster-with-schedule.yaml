# Excerpt: backup schedule section of a PerconaPGCluster CR
# Add this under spec.backups in your cluster manifest
backups:
  pgbackrest:
    repos:
      - name: repo1
        schedules:
          full: "0 2 * * *"
          differential: "0 14 * * *"
        s3:
          bucket: my-pg-backup-bucket
          region: us-east-1
          endpoint: ""
